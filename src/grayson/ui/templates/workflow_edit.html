{% extends "base.html" %}
{% block title %}grayson — edit {{ name }}{% endblock %}
{% block content %}
<nav class="crumbs"><a href="/workflows?t={{ token }}">Workflows</a><span class="sep">/</span>
  <a href="/workflows/{{ name }}?t={{ token }}">{{ name }}</a><span class="sep">/</span>
  <span>edit</span></nav>

<h1>Edit {{ name }} {{ help("workflow_yaml") }}</h1>

<form method="post" action="/workflows/{{ name }}/edit?t={{ token }}" style="margin-top: 14px;">
  <textarea name="yaml" rows="26" spellcheck="false"
    style="font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; line-height: 1.6;">{{ text }}</textarea>
  <div class="row" style="margin-top: 10px;">
    <button class="btn" type="submit">Save to library</button>
    <a class="btn ghost" href="/workflows/{{ name }}?t={{ token }}">Cancel</a>
  </div>
</form>
{% endblock %}
