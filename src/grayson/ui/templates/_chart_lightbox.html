<dialog id="chart-lightbox" class="lightbox" aria-label="Chart, enlarged">
  <div class="row split mb-2">
    <b id="lb-title" class="otitle"></b>
    <span class="row">
      <span id="lb-pos" class="faint small"></span>
      <button type="button" class="btn ghost sm" id="lb-prev" title="Previous chart (←)" aria-label="Previous chart">←</button>
      <button type="button" class="btn ghost sm" id="lb-next" title="Next chart (→)" aria-label="Next chart">→</button>
      <a class="btn secondary sm" id="lb-open" href="#">Data &amp; query</a>
      <button type="button" class="btn ghost sm" id="lb-close" title="Close (Esc)" aria-label="Close enlarged chart">✕</button>
    </span>
  </div>
  <div id="lb-body" class="lb-body"></div>
  <div id="lb-caption" class="faint small mt-2"></div>
</dialog>
