<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}grayson{% endblock %}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg fill='%2323b8c8'%3E%3Cpolygon points='2,8 15,20 15,25 4,13'/%3E%3Cpolygon points='30,8 17,20 17,25 28,13'/%3E%3C/g%3E%3C/svg%3E">
{% block head %}{% endblock %}
<script>
/* Stamp the pinned theme before first paint; "auto" stores nothing. */
try {
  var t = localStorage.getItem("grayson_theme");
  if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
} catch (e) {}
</script>
<style>
/* ---- tokens ---------------------------------------------------------- */
:root {
  color-scheme: dark;
  --bg: #0d1017; --panel: #131824; --panel2: #1a2130; --panel3: #202940;
  --border: #262e40; --border-soft: #1e2536;
  --ink: #e8ecf4; --ink-2: #b9c2d0; --muted: #8b94a6; --faint: #626c7e;
  /* chart series: validated categorical slots, stepped for the dark surface */
  --viz-s1: #3987e5; --viz-s2: #d95926; --viz-s3: #199e70;
  --act: #aeb9cc; --act-soft: rgba(174,185,204,.11);        /* interactive */
  --act-ink: #0d1017;                                       /* text on --act */
  --attn: #f0b429; --attn-soft: rgba(240,180,41,.10);       /* needs a human */
  --ok: #4ad295; --ok-soft: rgba(74,210,149,.10);           /* complete / verified */
  --bad: #ff7a85; --bad-soft: rgba(255,122,133,.10);        /* failed / rejected */
  --todo: #b3a5f2; --todo-soft: rgba(179,165,242,.12);      /* open / not yet done */
  --brand-gray: #7d8590; --brand-accent: #3ed6e0;           /* wordmark */
  --radius: 10px; --radius-sm: 7px;
}
/* Theme: dark is the base; light applies via the OS preference unless the
   user pinned a theme with the nav toggle (data-theme wins both ways). The
   light block exists twice on purpose — keep the two copies identical. */
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #f4f6f9; --panel: #ffffff; --panel2: #f1f3f7; --panel3: #e8ecf3;
    --border: #d7dce5; --border-soft: #e5e9f0;
    --ink: #1a1f29; --ink-2: #3d4554; --muted: #5d6675; --faint: #8a93a3;
    --viz-s1: #2a78d6; --viz-s2: #eb6834; --viz-s3: #1baf7a;
    --act: #48536a; --act-soft: rgba(72,83,106,.08);
    --act-ink: #ffffff;
    --attn: #b57900; --attn-soft: rgba(181,121,0,.09);
    --ok: #178a55; --ok-soft: rgba(23,138,85,.09);
    --bad: #c73545; --bad-soft: rgba(199,53,69,.08);
    --todo: #6553c9; --todo-soft: rgba(101,83,201,.09);
    --brand-gray: #8b939b; --brand-accent: #0aa5b5;
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f4f6f9; --panel: #ffffff; --panel2: #f1f3f7; --panel3: #e8ecf3;
  --border: #d7dce5; --border-soft: #e5e9f0;
  --ink: #1a1f29; --ink-2: #3d4554; --muted: #5d6675; --faint: #8a93a3;
  --viz-s1: #2a78d6; --viz-s2: #eb6834; --viz-s3: #1baf7a;
  --act: #48536a; --act-soft: rgba(72,83,106,.08);
  --act-ink: #ffffff;
  --attn: #b57900; --attn-soft: rgba(181,121,0,.09);
  --ok: #178a55; --ok-soft: rgba(23,138,85,.09);
  --bad: #c73545; --bad-soft: rgba(199,53,69,.08);
  --todo: #6553c9; --todo-soft: rgba(101,83,201,.09);
  --brand-gray: #8b939b; --brand-accent: #0aa5b5;
}
* { box-sizing: border-box; }
html { scrollbar-gutter: stable; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color: var(--act); text-decoration: none; }
a:hover { text-decoration: underline; }
code, .mono, pre { font-family: ui-monospace, "Cascadia Code", SFMono-Regular, Menlo,
  Consolas, monospace; font-size: 12.5px; }
pre { background: var(--panel2); border: 1px solid var(--border-soft);
  border-radius: var(--radius-sm); padding: 10px 12px; overflow-x: auto;
  margin: 8px 0; line-height: 1.5; }

/* ---- typography scale ------------------------------------------------ */
h1 { font-size: 20px; font-weight: 700; margin: 0 0 2px; letter-spacing: -.01em; }
h2 { font-size: 12px; font-weight: 650; margin: 28px 0 10px; color: var(--muted);
  text-transform: uppercase; letter-spacing: .09em; }
.overline { font-size: 11px; font-weight: 600; color: var(--muted);
  text-transform: uppercase; letter-spacing: .08em; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.ink2 { color: var(--ink-2); }
.small { font-size: 12px; }

/* ---- shell ----------------------------------------------------------- */
header { border-bottom: 1px solid var(--border); background: var(--panel);
  position: sticky; top: 0; z-index: 5; }
.shell { max-width: 1140px; margin: 0 auto; padding: 0 22px; }
.nav { display: flex; align-items: center; gap: 4px; height: 52px; }
.brand { font-weight: 700; margin-right: 18px; color: var(--ink);
  font-family: ui-monospace, "Cascadia Code", SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 15px; letter-spacing: -.02em; }
.brand:hover { text-decoration: none; }
.brand .b-gray { color: var(--brand-gray); }
.brand .b-wing { fill: var(--brand-accent); margin-left: 5px; flex: none; }
.brand { display: inline-flex; align-items: center; }
.tab { padding: 6px 12px; border-radius: 999px; color: var(--muted); font-weight: 550;
  font-size: 13.5px; }
.tab:hover { color: var(--ink); text-decoration: none; background: var(--panel2); }
.tab.active { color: var(--act); background: var(--act-soft); }
.themebtn { border: none; background: transparent; cursor: pointer; font-family: inherit; }
main { max-width: 1140px; margin: 0 auto; padding: 24px 22px 60px; }

/* ---- surfaces -------------------------------------------------------- */
.card { background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px 18px; margin-bottom: 12px; }
.card.attn { border-color: var(--attn); background:
  linear-gradient(var(--attn-soft), var(--attn-soft)), var(--panel); }
.card.empty { color: var(--muted); border-style: dashed; }
a.card { color: inherit; display: block; transition: border-color .15s, transform .15s, box-shadow .15s; }
a.card:hover { text-decoration: none; border-color: var(--muted); transform: translateY(-1px);
  box-shadow: 0 6px 18px rgba(0, 0, 0, .10); }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.banner { padding: 10px 14px; border-radius: var(--radius-sm); margin-bottom: 14px;
  border: 1px solid var(--bad); color: var(--bad); background: var(--bad-soft); }

/* ---- charts ---------------------------------------------------------- */
.chartgrid { display: grid; gap: 12px; align-items: start;
  grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); }
/* a lone chart stays a tile, not a banner */
.chartcard { margin-bottom: 0; max-width: 640px; }
details.chartcard > summary.chartsum, details.findcard > summary.chartsum {
  cursor: pointer; list-style: none;
  display: flex; align-items: center; gap: 8px; user-select: none; flex-wrap: wrap; }
details.chartcard > summary.chartsum::-webkit-details-marker,
details.findcard > summary.chartsum::-webkit-details-marker { display: none; }
.chartsum .c-caret { color: var(--faint); font-size: 11px; flex: none;
  transition: transform .15s; }
details.chartcard[open] > .chartsum .c-caret,
details.findcard[open] > .chartsum .c-caret { transform: rotate(90deg); }
details.chartcard:not([open]):hover, details.findcard:not([open]):hover {
  border-color: var(--muted); }
details.findcard.superseded { opacity: .62; }
details.findcard.superseded[open] { opacity: .85; }
@keyframes chart-in {
  from { opacity: 0; transform: translateX(32px); }
  to { opacity: 1; transform: none; }
}
.chartcard.chart-enter { animation: chart-in .5s cubic-bezier(.2, .7, .3, 1); }
.swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; display: inline-block; }
.swatch.s1 { background: var(--viz-s1); }
.swatch.s2 { background: var(--viz-s2); }
.swatch.s3 { background: var(--viz-s3); }

/* ---- stat tiles ------------------------------------------------------ */
.tiles { display: grid; gap: 10px; margin: 14px 0 4px;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
.tile { background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 12px 14px; }
.tile .num { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums;
  letter-spacing: -.01em; line-height: 1.2; }
.tile .num.attn { color: var(--attn); } .tile .num.ok { color: var(--ok); }
.tile .lbl { font-size: 11px; font-weight: 600; color: var(--muted);
  text-transform: uppercase; letter-spacing: .07em; margin-top: 2px; }

/* ---- badges ---------------------------------------------------------- */
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px;
  border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap;
  border: 1px solid var(--border); background: var(--panel2); color: var(--ink-2); }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%;
  background: var(--faint); flex: none; }
.badge.plain::before { display: none; }
.badge.act  { color: var(--act);  border-color: transparent; background: var(--act-soft); }
.badge.act::before  { background: var(--act); }
.badge.attn { color: var(--attn); border-color: transparent; background: var(--attn-soft); }
.badge.attn::before { background: var(--attn); }
.badge.ok   { color: var(--ok);   border-color: transparent; background: var(--ok-soft); }
.badge.ok::before   { background: var(--ok); }
.badge.bad  { color: var(--bad);  border-color: transparent; background: var(--bad-soft); }
.badge.bad::before  { background: var(--bad); }
.badge.todo { color: var(--todo); border-color: transparent; background: var(--todo-soft); }
.badge.todo::before { background: var(--todo); }

/* ---- buttons ----------------------------------------------------------
   One system across the console:
   .btn.confirm  solid amber  — committing a pending human decision
                                (accept finding, approve proposal, answer
                                an intervention)
   .btn.danger   red outline  — the negative decision (reject), kept quiet
   .btn / .btn.secondary / .btn.ghost — neutral actions and navigation */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 15px;
  border-radius: 8px; cursor: pointer; border: 1px solid var(--act);
  background: var(--act); color: var(--act-ink); font-size: 13px; font-weight: 620;
  font-family: inherit; transition: filter .12s, background .12s, border-color .12s,
  color .12s, transform .08s; }
.btn:active { transform: translateY(1px); }
.btn:hover { filter: brightness(1.08); }
.btn.secondary { background: transparent; color: var(--act); }
.btn.secondary:hover { background: var(--act-soft); filter: none; }
.btn.ghost { background: transparent; color: var(--muted); border-color: var(--border); }
.btn.ghost:hover { color: var(--ink); border-color: var(--muted); filter: none; }
/* the human-decision button wears the "needs a human" amber */
.btn.confirm { background: var(--attn); border-color: var(--attn); color: var(--act-ink); }
.btn.confirm:hover { filter: brightness(1.08); }
.btn.danger { background: transparent; color: var(--bad); border-color: var(--bad); }
.btn.danger:hover { background: var(--bad-soft); filter: none; }
.btn.sm { padding: 4px 11px; font-size: 12px; }

/* ---- tables ---------------------------------------------------------- */
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border-soft);
  vertical-align: top; }
tr:last-child td { border-bottom: none; }
th { color: var(--muted); font-weight: 600; font-size: 11px;
  text-transform: uppercase; letter-spacing: .07em; }
td.num { font-variant-numeric: tabular-nums; text-align: right; }
tr:hover > td { background: var(--act-soft); }
th, td { transition: background .12s; }
.scroll { overflow-x: auto; }

/* ---- collapsibles ---------------------------------------------------- */
details.fold { border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--panel); margin-bottom: 12px; }
details.fold > summary { cursor: pointer; padding: 11px 18px; font-weight: 600;
  font-size: 13px; color: var(--ink-2); list-style: none; display: flex;
  align-items: center; gap: 8px; user-select: none; }
details.fold > summary::before { content: "▸"; color: var(--faint); font-size: 11px;
  transition: transform .12s; }
details.fold[open] > summary::before { transform: rotate(90deg); }
details.fold > summary:hover { color: var(--ink); }
details.fold > .fold-body { padding: 2px 18px 14px; border-top: 1px solid var(--border-soft); }
details.inlinefold > summary { cursor: pointer; color: var(--act); font-size: 12.5px;
  list-style: none; user-select: none; }
details.inlinefold > summary::-webkit-details-marker { display: none; }
details.opening > :not(summary) { animation: fade-down .2s ease-out both; }
@keyframes fade-down { from { opacity: 0; transform: translateY(-4px); } }
@keyframes fade-in { from { opacity: 0; } }

/* ---- inline help ----------------------------------------------------- */
.help { position: relative; display: inline-flex; }
.help > span.h-i { width: 15px; height: 15px; border-radius: 50%; font-size: 10.5px;
  display: inline-flex; align-items: center; justify-content: center; cursor: help;
  border: 1px solid var(--faint); color: var(--faint); font-weight: 650;
  font-style: normal; transition: color .12s, border-color .12s; }
.help:hover > span.h-i { border-color: var(--act); color: var(--act); }
.help > .h-pop { display: none; position: absolute; left: 50%; bottom: calc(100% + 8px);
  transform: translateX(-50%); width: 270px; background: var(--panel3);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 10px 12px; font-size: 12.5px; line-height: 1.5; color: var(--ink-2);
  z-index: 20; box-shadow: 0 6px 24px rgba(0,0,0,.35); font-weight: 400;
  text-transform: none; letter-spacing: normal; white-space: normal; }
.help:hover > .h-pop, .help:focus-within > .h-pop { display: block;
  animation: fade-in .14s ease-out; }
/* hung off a heading, the popover opens down and to the right, clear of the
   page edge and the sticky header */
h1 > .help > .h-pop, h2 > .help > .h-pop { left: 0; transform: none;
  bottom: auto; top: calc(100% + 8px); }

/* ---- agent-text sections --------------------------------------------- */
.sections .sec { margin: 10px 0; }
.sections .sec-h { font-size: 11px; font-weight: 700; color: var(--act);
  text-transform: uppercase; letter-spacing: .08em; margin-bottom: 3px; }
.sections .sec-b { color: var(--ink-2); }
.sections .sec:first-child { margin-top: 4px; }

/* ---- page header & breadcrumbs -------------------------------------- */
.crumbs { display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
  font-size: 12.5px; color: var(--faint); margin-bottom: 8px; }
.crumbs a { color: var(--muted); }
.crumbs a:hover { color: var(--ink); text-decoration: none; }
.crumbs .sep { color: var(--border); }
.crumbs .badge { margin-left: 2px; }
.pagehead { display: flex; align-items: flex-start; justify-content: space-between;
  gap: 14px; flex-wrap: wrap; margin-bottom: 12px; }
.pagehead .titles { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.pagehead .titlerow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.pagehead .titlerow h1 { margin: 0; }
.pagehead .actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.lede { color: var(--muted); font-size: 13px; max-width: 640px; }

/* ---- stage timeline ---------------------------------------------------
   One node per stage on a continuous track; the track fills as stages
   complete, the current node breathes, gates sit on the track before the
   stage they guard. A stage advance between two loads of the live page is
   animated by the base script (class tl-advance). */
.timeline { position: relative; display: flex; align-items: flex-start; margin: 14px 0 4px;
  padding: 16px 10px 12px; background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); overflow-x: auto; }
.tl-help { position: absolute; top: 7px; right: 9px; }
.tl-step { position: relative; flex: 1 1 0; min-width: 78px; display: flex;
  flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.tl-step::before, .tl-step::after { content: ""; position: absolute; top: 10px;
  height: 2px; background: var(--border); }
.tl-step::before { left: 0; right: 50%; }
.tl-step::after { left: 50%; right: 0; }
.tl-step:first-child::before, .tl-step:last-child::after { display: none; }
.tl-step.done::before, .tl-step.done::after, .tl-step.now::before { background: var(--ok); }
.tl-node { position: relative; z-index: 1; width: 22px; height: 22px; border-radius: 50%;
  display: grid; place-items: center; background: var(--panel);
  border: 2px solid var(--border); color: var(--act-ink);
  transition: background .2s, border-color .2s; }
.tl-node svg { width: 12px; height: 12px; }
.tl-step.done .tl-node { background: var(--ok); border-color: var(--ok); }
.tl-step.now .tl-node { border-color: var(--brand-accent); }
.tl-step.now .tl-node::after { content: ""; width: 8px; height: 8px; border-radius: 50%;
  background: var(--brand-accent); }
.tl-step.now:not(.final) .tl-node::before { content: ""; position: absolute; inset: -2px;
  border-radius: 50%; border: 2px solid var(--brand-accent);
  animation: tl-breathe 2.6s ease-out infinite; }
@keyframes tl-breathe {
  0% { transform: scale(1); opacity: .75; }
  70%, 100% { transform: scale(2.2); opacity: 0; }
}
/* a closed session ends the track in its outcome colour, without the pulse */
.tl-step.final .tl-node { background: var(--ok); border-color: var(--ok); }
.tl-step.final .tl-node::after { display: none; }
.tl-step.final.findings .tl-node { background: var(--act); border-color: var(--act); }
.tl-step.final.abandoned .tl-node { background: var(--todo); border-color: var(--todo); }
.tl-label { font-size: 11.5px; font-weight: 600; color: var(--faint);
  text-transform: capitalize; letter-spacing: .01em; transition: color .2s; }
.tl-step.done .tl-label { color: var(--muted); }
.tl-step.now .tl-label { color: var(--ink); }
.tl-sub { font-size: 11px; color: var(--muted); margin-top: -6px; }
.tl-gate { position: absolute; z-index: 2; top: 2px; left: -9px; width: 18px; height: 18px;
  border-radius: 5px; display: grid; place-items: center; background: var(--panel);
  border: 1px solid var(--border); color: var(--faint); cursor: help;
  transition: color .2s, border-color .2s, background .2s; }
.tl-gate svg { width: 11px; height: 11px; }
.tl-gate.ready { color: var(--attn); border-color: var(--attn); background: var(--attn-soft); }
.tl-gate.passed { color: var(--ok); border-color: var(--ok); background: var(--ok-soft); }
/* stage advance: each segment fills left to right — the trailing half of the
   node just passed, then the leading half of the next, then that node pops.
   --k is the step's position in the advance, set by the base script. */
.tl-step.tl-advance.done::after {
  transform-origin: left; animation: tl-fill .25s ease-out both;
  animation-delay: calc(var(--k, 0) * .6s); }
.tl-step.tl-advance:not(.from)::before {
  transform-origin: left; animation: tl-fill .25s ease-out both;
  animation-delay: calc((var(--k, 0) - 1) * .6s + .25s); }
.tl-step.tl-advance:not(.from) .tl-node {
  animation: tl-pop .4s cubic-bezier(.2, .7, .3, 1.4) both;
  animation-delay: calc((var(--k, 0) - 1) * .6s + .45s); }
@keyframes tl-fill { from { transform: scaleX(0); } }
@keyframes tl-pop { from { transform: scale(.55); } }

/* ---- compact stage bar (session cards) --------------------------------- */
.stagebar { display: flex; align-items: center; gap: 3px; margin-top: 10px; }
.stagebar i { flex: 1; height: 3px; border-radius: 2px; background: var(--border); }
.stagebar i.done { background: var(--ok); }
.stagebar i.now { background: var(--brand-accent); }
.stagebar .lbl { margin-left: 7px; font-size: 11px; font-weight: 600; color: var(--muted);
  text-transform: capitalize; white-space: nowrap; }

/* ---- choices (interventions) ------------------------------------------ */
.choices { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.choices.inline { flex-direction: row; flex-wrap: wrap; }
.choice { display: flex; align-items: flex-start; gap: 10px; padding: 9px 12px;
  border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--panel2);
  cursor: pointer; font-size: 13px; color: var(--ink-2);
  transition: border-color .15s, background .15s, color .15s; }
.choice:hover { border-color: var(--muted); color: var(--ink); }
.choice:has(input:checked) { border-color: var(--brand-accent); background: var(--act-soft);
  color: var(--ink); }
.choice input { margin: 2px 0 0; flex: none; }
.statement { border-left: 3px solid var(--attn); padding: 6px 12px; margin: 4px 0 10px;
  color: var(--ink); font-size: 14px; }

/* ---- spacing utilities ------------------------------------------------ */
.mt-1 { margin-top: 4px; } .mt-2 { margin-top: 8px; } .mt-3 { margin-top: 12px; }
.mt-4 { margin-top: 16px; }
.mb-1 { margin-bottom: 4px; } .mb-2 { margin-bottom: 8px; } .mb-3 { margin-bottom: 12px; }
.grow { flex: 1; }

/* ---- relationship canvas --------------------------------------------- */
.relgraph { border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--panel); overflow: hidden; }
.relgraph-bar { display: flex; align-items: center; justify-content: space-between;
  gap: 10px; flex-wrap: wrap; padding: 8px 12px;
  border-bottom: 1px solid var(--border-soft); background: var(--panel2); }
.relgraph-stage { position: relative; height: var(--rg-h, 420px); }
.relgraph-canvas { position: absolute; inset: 0; }
/* The note sits under the canvas: it reads "Loading diagram" until the canvas
   is up, then either disappears or carries the failure reason. */
.relgraph-note { position: absolute; inset: 0; display: flex; align-items: center;
  justify-content: center; color: var(--muted); font-size: 12.5px;
  pointer-events: none; padding: 0 20px; text-align: center; }
.relgraph.ready .relgraph-note { display: none; }
.relgraph.failed .relgraph-note { color: var(--attn); }
.relgraph-tip { position: absolute; z-index: 4; max-width: 320px;
  background: var(--panel3); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 7px 10px; font-size: 12px;
  line-height: 1.5; color: var(--ink-2); pointer-events: none;
  box-shadow: 0 6px 24px rgba(0,0,0,.35); }
.relgraph-tip b { font-family: ui-monospace, Consolas, monospace; color: var(--ink); }
.relgraph-legend { padding: 8px 12px; border-top: 1px solid var(--border-soft); }
.attn-text { color: var(--attn); }

/* ---- misc ------------------------------------------------------------ */
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row.split { justify-content: space-between; }
.kv { display: flex; gap: 8px; flex-wrap: wrap; }
.kv .item { background: var(--panel2); border: 1px solid var(--border-soft);
  border-radius: var(--radius-sm); padding: 5px 10px; font-size: 12.5px; }
.kv > form.item { flex: 0 1 auto; }   /* a control strip wraps to a new row whole, at its own width */
.kv .item b { color: var(--muted); font-weight: 600; font-size: 11px;
  text-transform: uppercase; letter-spacing: .06em; margin-right: 5px; }
.chip { display: inline-block; background: var(--panel2); border: 1px solid var(--border-soft);
  border-radius: 5px; padding: 1px 7px; font-size: 11.5px;
  font-family: ui-monospace, Consolas, monospace; color: var(--ink-2); }
a.chip { color: var(--ink-2); }
a.chip:hover { border-color: var(--act); color: var(--ink); text-decoration: none; }

/* ---- sql highlighting ------------------------------------------------ */
pre.sql { line-height: 1.65; white-space: pre-wrap; word-break: break-word;
  position: relative; padding-right: 58px; }
.copybtn { position: absolute; top: 6px; right: 6px; border: 1px solid var(--border);
  background: var(--panel); color: var(--muted); border-radius: 6px; padding: 2px 9px;
  font: 600 11px/1.6 ui-sans-serif, system-ui, sans-serif; cursor: pointer;
  opacity: 0; transition: opacity .12s; }
pre.sql:hover .copybtn, .copybtn:focus-visible { opacity: 1; }
.copybtn:hover { color: var(--ink); border-color: var(--muted); }
.copybtn.done { color: var(--ok); border-color: var(--ok); opacity: 1; }
.sql-k { color: var(--todo); font-weight: 600; }
.sql-s { color: var(--ok); }
.sql-n { color: var(--attn); }
.sql-c { color: var(--faint); font-style: italic; }
input[type=text], input[type=search], textarea, select { background: var(--panel2);
  border: 1px solid var(--border); color: var(--ink); border-radius: 7px;
  padding: 7px 10px; font: inherit; width: 100%; }
input[type=search] { max-width: 380px; }
input:focus, textarea:focus, select:focus { outline: none;
  border-color: var(--brand-accent); }
input[type=checkbox], input[type=radio] { accent-color: var(--brand-accent); width: auto; }
input, textarea, select { transition: border-color .12s; }
form.inline { display: inline; }
.searchrow { display: flex; gap: 8px; align-items: center; margin: 12px 0 16px; }
dl.props { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; align-items: baseline;
  margin: 8px 0; }
dl.props dt { color: var(--muted); font-size: 11px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .06em; padding-top: 2px; }
dl.props dd { margin: 0; color: var(--ink-2); }
.chartbody { cursor: zoom-in; }
.chart-large svg { width: 100%; height: auto; }
dialog.lightbox { border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--panel); color: var(--ink); padding: 14px 16px;
  width: min(1100px, 94vw); max-height: 92vh; overflow: auto; }
dialog.lightbox[open] { animation: dlg-in .22s cubic-bezier(.2, .7, .3, 1); }
dialog.lightbox[open]::backdrop { animation: fade-in .22s ease-out; }
dialog.lightbox::backdrop { background: rgba(0, 0, 0, .55); }
@keyframes dlg-in { from { opacity: 0; transform: translateY(10px) scale(.985); } }
.lb-body svg { width: 100%; height: auto; display: block; }
/* chart labels: a shortened tick carries its full text — hover, tap, or focus */
.chartbody svg text.tick-cut, .lb-body svg text.tick-cut, .chart-large svg text.tick-cut {
  cursor: help; }
svg text.tick-cut:hover, svg text.tick-cut:focus { fill: var(--ink); outline: none; }
.viz-tip { position: fixed; z-index: 30; max-width: 360px; background: var(--panel3);
  border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 6px 10px;
  font-size: 12px; line-height: 1.5; color: var(--ink-2); pointer-events: none;
  box-shadow: 0 6px 24px rgba(0,0,0,.35); overflow-wrap: anywhere; }
.viz-tip.mono { font-family: ui-monospace, Consolas, monospace; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important;
    animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<header><div class="shell">
  <nav class="nav">
    <a class="brand" href="/?t={{ token }}"><span class="b-gray">gray</span>son<svg class="b-wing" width="15" height="9" viewBox="2 8 28 17" aria-hidden="true"><polygon points="2,8 15,20 15,25 4,13"/><polygon points="30,8 17,20 17,25 28,13"/></svg></a>
    <a class="tab {{ 'active' if nav == 'sessions' }}" href="/?t={{ token }}">Sessions</a>
    <a class="tab {{ 'active' if nav == 'workflows' }}" href="/workflows?t={{ token }}">Workflows</a>
    <a class="tab {{ 'active' if nav == 'knowledge' }}" href="/knowledge?t={{ token }}">Knowledge</a>
    <a class="tab {{ 'active' if nav == 'checks' }}" href="/checks?t={{ token }}">Checks</a>
    <a class="tab {{ 'active' if nav == 'records' }}" href="/records?t={{ token }}">Records</a>
    <span class="grow"></span>
    <button class="tab themebtn" type="button" id="themebtn"
      title="Theme: follows your OS unless pinned">◐ auto</button>
    <a class="tab {{ 'active' if nav == 'settings' }}" href="/settings?t={{ token }}"
      title="Workspace settings">Settings</a>
  </nav>
</div></header>
<script>
(function () {
  var btn = document.getElementById("themebtn");
  var order = ["auto", "light", "dark"];
  var icons = { auto: "◐ auto", light: "○ light", dark: "● dark" };
  function current() {
    try { return localStorage.getItem("grayson_theme") || "auto"; } catch (e) { return "auto"; }
  }
  function apply(mode) {
    if (mode === "auto") delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = mode;
    btn.textContent = icons[mode];
  }
  btn.addEventListener("click", function () {
    var next = order[(order.indexOf(current()) + 1) % order.length];
    try {
      if (next === "auto") localStorage.removeItem("grayson_theme");
      else localStorage.setItem("grayson_theme", next);
    } catch (e) {}
    apply(next);
  });
  apply(current());
})();
</script>
<main>
{% if error %}<div class="banner">{{ error }}</div>{% endif %}
{% block content %}{% endblock %}
</main>
<script>
/* Copy-to-clipboard on every SQL block. Text is captured before the button is
   appended so the button's own label never ends up in the copied text. */
(function () {
  function copy(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text);
    }
    var ta = document.createElement("textarea");   /* http://127.0.0.1 fallback */
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } finally { document.body.removeChild(ta); }
    return Promise.resolve();
  }
  document.querySelectorAll("pre.sql").forEach(function (pre) {
    var text = pre.textContent;
    var btn = document.createElement("button");
    btn.type = "button"; btn.className = "copybtn"; btn.textContent = "copy";
    btn.title = "Copy SQL to clipboard";
    btn.addEventListener("click", function () {
      copy(text).then(function () {
        btn.textContent = "copied"; btn.classList.add("done");
        setTimeout(function () {
          btn.textContent = "copy"; btn.classList.remove("done");
        }, 1400);
      });
    });
    pre.appendChild(btn);
  });
})();

/* Chart tooltips. A shortened axis label carries its full text in data-full
   and a mark carries its value in a <title>; both show in an HTML tip at once,
   where the native SVG tooltip is slow, hover-only, and absent on touch.
   Delegated from the document, so the lightbox's cloned or fetched SVG needs
   no rebinding; mark titles move into data-tip once so the native tooltip does
   not double up (exports render fresh and keep theirs). */
(function () {
  var SCOPE = ".chartbody svg, .lb-body svg, .chart-large svg";
  function adopt(root) {
    if (!root.querySelectorAll) return;
    root.querySelectorAll(SCOPE).forEach(function (svg) {
      svg.querySelectorAll("path > title, circle > title").forEach(function (t) {
        t.parentNode.dataset.tip = t.textContent; t.remove();
      });
      svg.querySelectorAll("text[data-full] > title").forEach(function (t) { t.remove(); });
    });
  }
  adopt(document);
  new MutationObserver(function (records) {
    records.forEach(function (r) { r.addedNodes.forEach(adopt); });
  }).observe(document.body, { childList: true, subtree: true });

  var tip = document.createElement("div");
  tip.className = "viz-tip"; tip.hidden = true;
  document.body.appendChild(tip);
  var pinned = null;
  function target(e) {
    var el = e.target && e.target.closest && e.target.closest("[data-full], [data-tip]");
    return el && el.closest(SCOPE) ? el : null;
  }
  function place(x, y) {
    var w = tip.offsetWidth, h = tip.offsetHeight;
    var left = Math.min(x + 12, window.innerWidth - w - 8);
    var top = y - h - 10;
    if (top < 8) top = y + 16;
    tip.style.left = Math.max(8, left) + "px"; tip.style.top = top + "px";
  }
  function show(el, x, y) {
    tip.textContent = el.dataset.full || el.dataset.tip || "";
    tip.classList.toggle("mono", !!el.dataset.full);
    tip.hidden = false;
    place(x, y);
  }
  function hide() { if (!pinned) tip.hidden = true; }
  document.addEventListener("pointerover", function (e) {
    var el = target(e);
    if (el && e.pointerType !== "touch") show(el, e.clientX, e.clientY);
  });
  document.addEventListener("pointermove", function (e) {
    if (!tip.hidden && !pinned && e.pointerType !== "touch") place(e.clientX, e.clientY);
  });
  document.addEventListener("pointerout", function (e) { if (target(e)) hide(); });
  document.addEventListener("pointerdown", function (e) {
    var el = target(e);
    if (e.pointerType === "touch" && el) { pinned = el; show(el, e.clientX, e.clientY); }
    else { pinned = null; tip.hidden = true; }
  });
  document.addEventListener("focusin", function (e) {
    var el = target(e);
    if (!el) return;
    var r = el.getBoundingClientRect();
    show(el, r.left + r.width / 2, r.top);
  });
  document.addEventListener("focusout", function (e) { if (target(e)) hide(); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { pinned = null; tip.hidden = true; }
  });
})();

/* Folds ease open only on a user toggle, never on page load: the live views
   reload every few seconds and must not flicker. */
document.addEventListener("toggle", function (e) {
  var d = e.target;
  if (!d || d.tagName !== "DETAILS" || !d.open) return;
  d.classList.add("opening");
  setTimeout(function () { d.classList.remove("opening"); }, 260);
}, true);

/* Stage timeline: when the stage has advanced since this browser last saw
   the session, the newly completed track fills in and the nodes pop. */
(function () {
  var tl = document.querySelector(".timeline[data-session]");
  if (!tl) return;
  var key = "grayson_stage_" + tl.dataset.session;
  var now = parseInt(tl.dataset.stage, 10);
  var seen = null;
  try { seen = localStorage.getItem(key); localStorage.setItem(key, String(now)); } catch (e) {}
  if (seen === null) return;
  seen = parseInt(seen, 10);
  if (!(now > seen)) return;
  var steps = tl.querySelectorAll(".tl-step");
  for (var i = Math.max(seen, 0); i <= now && i < steps.length; i++) {
    steps[i].style.setProperty("--k", String(i - seen));
    steps[i].classList.add("tl-advance");
    if (i === seen) steps[i].classList.add("from");
  }
})();

/* Collapsible tiles (charts, findings): the server opens the newest few; a
   manual toggle is remembered per tile so the 10s live refresh doesn't fight
   the user. */
(function () {
  var cards = document.querySelectorAll("details[data-fold]");
  if (!cards.length) return;
  var key = "grayson_fold_" + location.pathname;
  var saved = {};
  try { saved = JSON.parse(localStorage.getItem(key) || "{}"); } catch (e) {}
  cards.forEach(function (d) {
    var id = d.dataset.fold;
    if (id in saved) d.open = !!saved[id];
    d.addEventListener("toggle", function () {
      saved[id] = d.open ? 1 : 0;
      try { localStorage.setItem(key, JSON.stringify(saved)); } catch (e) {}
    });
  });
})();
</script>
