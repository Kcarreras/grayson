<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}grayson{% endblock %}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg fill='%2323b8c8'%3E%3Cpolygon points='2,8 15,20 15,25 4,13'/%3E%3Cpolygon points='30,8 17,20 17,25 28,13'/%3E%3C/g%3E%3C/svg%3E">
{% block head %}{% endblock %}
<script>
/* Stamp the pinned theme before first paint; "auto" stores nothing. */
try {
  var t = localStorage.getItem("grayson_theme");
  if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
} catch (e) {}
</script>
<style>
/* ---- tokens ---------------------------------------------------------- */
:root {
  color-scheme: dark;
  --bg: #0d1017; --panel: #131824; --panel2: #1a2130; --panel3: #202940;
  --border: #262e40; --border-soft: #1e2536;
  --ink: #e8ecf4; --ink-2: #b9c2d0; --muted: #8b94a6; --faint: #626c7e;
  /* chart series: validated categorical slots, stepped for the dark surface */
  --viz-s1: #3987e5; --viz-s2: #d95926; --viz-s3: #199e70;
  --act: #aeb9cc; --act-soft: rgba(174,185,204,.11);        /* interactive */
  --act-ink: #0d1017;                                       /* text on --act */
  --attn: #f0b429; --attn-soft: rgba(240,180,41,.10);       /* needs a human */
  --ok: #4ad295; --ok-soft: rgba(74,210,149,.10);           /* complete / verified */
  --bad: #ff7a85; --bad-soft: rgba(255,122,133,.10);        /* failed / rejected */
  --todo: #b3a5f2; --todo-soft: rgba(179,165,242,.12);      /* open / not yet done */
  --brand-gray: #7d8590; --brand-accent: #3ed6e0;           /* wordmark */
  --radius: 10px; --radius-sm: 7px;
}
/* Theme: dark is the base; light applies via the OS preference unless the
   user pinned a theme with the nav toggle (data-theme wins both ways). The
   light block exists twice on purpose — keep the two copies identical. */
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #f4f6f9; --panel: #ffffff; --panel2: #f1f3f7; --panel3: #e8ecf3;
    --border: #d7dce5; --border-soft: #e5e9f0;
    --ink: #1a1f29; --ink-2: #3d4554; --muted: #5d6675; --faint: #8a93a3;
    --viz-s1: #2a78d6; --viz-s2: #eb6834; --viz-s3: #1baf7a;
    --act: #48536a; --act-soft: rgba(72,83,106,.08);
    --act-ink: #ffffff;
    --attn: #b57900; --attn-soft: rgba(181,121,0,.09);
    --ok: #178a55; --ok-soft: rgba(23,138,85,.09);
    --bad: #c73545; --bad-soft: rgba(199,53,69,.08);
    --todo: #6553c9; --todo-soft: rgba(101,83,201,.09);
    --brand-gray: #8b939b; --brand-accent: #0aa5b5;
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f4f6f9; --panel: #ffffff; --panel2: #f1f3f7; --panel3: #e8ecf3;
  --border: #d7dce5; --border-soft: #e5e9f0;
  --ink: #1a1f29; --ink-2: #3d4554; --muted: #5d6675; --faint: #8a93a3;
  --viz-s1: #2a78d6; --viz-s2: #eb6834; --viz-s3: #1baf7a;
  --act: #48536a; --act-soft: rgba(72,83,106,.08);
  --act-ink: #ffffff;
  --attn: #b57900; --attn-soft: rgba(181,121,0,.09);
  --ok: #178a55; --ok-soft: rgba(23,138,85,.09);
  --bad: #c73545; --bad-soft: rgba(199,53,69,.08);
  --todo: #6553c9; --todo-soft: rgba(101,83,201,.09);
  --brand-gray: #8b939b; --brand-accent: #0aa5b5;
}
* { box-sizing: border-box; }
html { scrollbar-gutter: stable; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color: var(--act); text-decoration: none; }
a:hover { text-decoration: underline; }
code, .mono, pre { font-family: ui-monospace, "Cascadia Code", SFMono-Regular, Menlo,
  Consolas, monospace; font-size: 12.5px; }
pre { background: var(--panel2); border: 1px solid var(--border-soft);
  border-radius: var(--radius-sm); padding: 10px 12px; overflow-x: auto;
  margin: 8px 0; line-height: 1.5; }

/* ---- typography scale ------------------------------------------------ */
h1 { font-size: 20px; font-weight: 700; margin: 0 0 2px; letter-spacing: -.01em; }
h2 { font-size: 12px; font-weight: 650; margin: 28px 0 10px; color: var(--muted);
  text-transform: uppercase; letter-spacing: .09em; }
.overline { font-size: 11px; font-weight: 600; color: var(--muted);
  text-transform: uppercase; letter-spacing: .08em; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.ink2 { color: var(--ink-2); }
.small { font-size: 12px; }

/* ---- shell ----------------------------------------------------------- */
header { border-bottom: 1px solid var(--border); background: var(--panel);
  position: sticky; top: 0; z-index: 5; }
.shell { max-width: 1140px; margin: 0 auto; padding: 0 22px; }
.nav { display: flex; align-items: center; gap: 4px; height: 52px; }
.brand { font-weight: 700; margin-right: 18px; color: var(--ink);
  font-family: ui-monospace, "Cascadia Code", SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 15px; letter-spacing: -.02em; }
.brand:hover { text-decoration: none; }
.brand .b-gray { color: var(--brand-gray); }
.brand .b-wing { fill: var(--brand-accent); margin-left: 5px; flex: none; }
.brand { display: inline-flex; align-items: center; }
.tab { padding: 6px 12px; border-radius: 999px; color: var(--muted); font-weight: 550;
  font-size: 13.5px; }
.tab:hover { color: var(--ink); text-decoration: none; background: var(--panel2); }
.tab.active { color: var(--act); background: var(--act-soft); }
.themebtn { border: none; background: transparent; cursor: pointer; font-family: inherit; }
main { max-width: 1140px; margin: 0 auto; padding: 24px 22px 60px; }

/* ---- surfaces -------------------------------------------------------- */
.card { background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px 18px; margin-bottom: 12px; }
.card.attn { border-color: var(--attn); background:
  linear-gradient(var(--attn-soft), var(--attn-soft)), var(--panel); }
.card.empty { color: var(--muted); border-style: dashed; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.banner { padding: 10px 14px; border-radius: var(--radius-sm); margin-bottom: 14px;
  border: 1px solid var(--bad); color: var(--bad); background: var(--bad-soft); }

/* ---- charts ---------------------------------------------------------- */
.chartgrid { display: grid; gap: 12px;
  grid-template-columns: repeat(auto-fit, minmax(min(460px, 100%), 1fr)); }
.chartcard { margin-bottom: 0; }
.swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; display: inline-block; }
.swatch.s1 { background: var(--viz-s1); }
.swatch.s2 { background: var(--viz-s2); }
.swatch.s3 { background: var(--viz-s3); }

/* ---- stat tiles ------------------------------------------------------ */
.tiles { display: grid; gap: 10px; margin: 14px 0 4px;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
.tile { background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 12px 14px; }
.tile .num { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums;
  letter-spacing: -.01em; line-height: 1.2; }
.tile .num.attn { color: var(--attn); } .tile .num.ok { color: var(--ok); }
.tile .lbl { font-size: 11px; font-weight: 600; color: var(--muted);
  text-transform: uppercase; letter-spacing: .07em; margin-top: 2px; }

/* ---- badges ---------------------------------------------------------- */
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px;
  border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap;
  border: 1px solid var(--border); background: var(--panel2); color: var(--ink-2); }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%;
  background: var(--faint); flex: none; }
.badge.plain::before { display: none; }
.badge.act  { color: var(--act);  border-color: transparent; background: var(--act-soft); }
.badge.act::before  { background: var(--act); }
.badge.attn { color: var(--attn); border-color: transparent; background: var(--attn-soft); }
.badge.attn::before { background: var(--attn); }
.badge.ok   { color: var(--ok);   border-color: transparent; background: var(--ok-soft); }
.badge.ok::before   { background: var(--ok); }
.badge.bad  { color: var(--bad);  border-color: transparent; background: var(--bad-soft); }
.badge.bad::before  { background: var(--bad); }
.badge.todo { color: var(--todo); border-color: transparent; background: var(--todo-soft); }
.badge.todo::before { background: var(--todo); }

/* ---- buttons --------------------------------------------------------- */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 15px;
  border-radius: 8px; cursor: pointer; border: 1px solid var(--act);
  background: var(--act); color: var(--act-ink); font-size: 13px; font-weight: 620;
  font-family: inherit; }
.btn:hover { filter: brightness(1.08); }
.btn.secondary { background: transparent; color: var(--act); }
.btn.secondary:hover { background: var(--act-soft); filter: none; }
.btn.ghost { background: transparent; color: var(--muted); border-color: var(--border); }
.btn.ghost:hover { color: var(--ink); border-color: var(--muted); filter: none; }
.btn.danger { background: transparent; color: var(--bad); border-color: var(--bad); }
.btn.danger:hover { background: var(--bad-soft); filter: none; }
.btn.sm { padding: 4px 11px; font-size: 12px; }

/* ---- tables ---------------------------------------------------------- */
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border-soft);
  vertical-align: top; }
tr:last-child td { border-bottom: none; }
th { color: var(--muted); font-weight: 600; font-size: 11px;
  text-transform: uppercase; letter-spacing: .07em; }
td.num { font-variant-numeric: tabular-nums; text-align: right; }
.scroll { overflow-x: auto; }

/* ---- collapsibles ---------------------------------------------------- */
details.fold { border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--panel); margin-bottom: 12px; }
details.fold > summary { cursor: pointer; padding: 11px 18px; font-weight: 600;
  font-size: 13px; color: var(--ink-2); list-style: none; display: flex;
  align-items: center; gap: 8px; user-select: none; }
details.fold > summary::before { content: "▸"; color: var(--faint); font-size: 11px;
  transition: transform .12s; }
details.fold[open] > summary::before { transform: rotate(90deg); }
details.fold > summary:hover { color: var(--ink); }
details.fold > .fold-body { padding: 2px 18px 14px; border-top: 1px solid var(--border-soft); }
details.inlinefold > summary { cursor: pointer; color: var(--act); font-size: 12.5px;
  list-style: none; user-select: none; }
details.inlinefold > summary::-webkit-details-marker { display: none; }

/* ---- inline help ----------------------------------------------------- */
.help { position: relative; display: inline-flex; }
.help > span.h-i { width: 15px; height: 15px; border-radius: 50%; font-size: 10.5px;
  display: inline-flex; align-items: center; justify-content: center; cursor: help;
  border: 1px solid var(--faint); color: var(--faint); font-weight: 650;
  font-style: normal; }
.help:hover > span.h-i { border-color: var(--act); color: var(--act); }
.help > .h-pop { display: none; position: absolute; left: 50%; bottom: calc(100% + 8px);
  transform: translateX(-50%); width: 270px; background: var(--panel3);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 10px 12px; font-size: 12.5px; line-height: 1.5; color: var(--ink-2);
  z-index: 20; box-shadow: 0 6px 24px rgba(0,0,0,.35); font-weight: 400;
  text-transform: none; letter-spacing: normal; white-space: normal; }
.help:hover > .h-pop, .help:focus-within > .h-pop { display: block; }

/* ---- agent-text sections --------------------------------------------- */
.sections .sec { margin: 10px 0; }
.sections .sec-h { font-size: 11px; font-weight: 700; color: var(--act);
  text-transform: uppercase; letter-spacing: .08em; margin-bottom: 3px; }
.sections .sec-b { color: var(--ink-2); }
.sections .sec:first-child { margin-top: 4px; }

/* ---- stage steps ----------------------------------------------------- */
.steps { display: flex; align-items: center; gap: 0; flex-wrap: wrap; margin: 10px 0 4px; }
.step { display: flex; align-items: center; gap: 6px; font-size: 12px;
  color: var(--faint); }
.step .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border);
  flex: none; }
.step.done { color: var(--muted); } .step.done .dot { background: var(--ok); }
.step.now { color: var(--ink); font-weight: 650; } .step.now .dot {
  background: var(--brand-accent); box-shadow: 0 0 0 3px var(--act-soft); }
.step + .step::before { content: ""; width: 22px; height: 1px; background: var(--border);
  margin: 0 8px; }

/* ---- relationship canvas --------------------------------------------- */
.relgraph { border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--panel); overflow: hidden; }
.relgraph-bar { display: flex; align-items: center; justify-content: space-between;
  gap: 10px; flex-wrap: wrap; padding: 8px 12px;
  border-bottom: 1px solid var(--border-soft); background: var(--panel2); }
.relgraph-stage { position: relative; height: var(--rg-h, 420px); }
.relgraph-canvas { position: absolute; inset: 0; }
/* The note sits under the canvas: it reads "Loading diagram" until the canvas
   is up, then either disappears or carries the failure reason. */
.relgraph-note { position: absolute; inset: 0; display: flex; align-items: center;
  justify-content: center; color: var(--muted); font-size: 12.5px;
  pointer-events: none; padding: 0 20px; text-align: center; }
.relgraph.ready .relgraph-note { display: none; }
.relgraph.failed .relgraph-note { color: var(--attn); }
.relgraph-tip { position: absolute; z-index: 4; max-width: 320px;
  background: var(--panel3); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 7px 10px; font-size: 12px;
  line-height: 1.5; color: var(--ink-2); pointer-events: none;
  box-shadow: 0 6px 24px rgba(0,0,0,.35); }
.relgraph-tip b { font-family: ui-monospace, Consolas, monospace; color: var(--ink); }
.relgraph-legend { padding: 8px 12px; border-top: 1px solid var(--border-soft); }
.attn-text { color: var(--attn); }

/* ---- misc ------------------------------------------------------------ */
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row.split { justify-content: space-between; }
.kv { display: flex; gap: 8px; flex-wrap: wrap; }
.kv .item { background: var(--panel2); border: 1px solid var(--border-soft);
  border-radius: var(--radius-sm); padding: 5px 10px; font-size: 12.5px; }
.kv .item b { color: var(--muted); font-weight: 600; font-size: 11px;
  text-transform: uppercase; letter-spacing: .06em; margin-right: 5px; }
.chip { display: inline-block; background: var(--panel2); border: 1px solid var(--border-soft);
  border-radius: 5px; padding: 1px 7px; font-size: 11.5px;
  font-family: ui-monospace, Consolas, monospace; color: var(--ink-2); }
a.chip { color: var(--ink-2); }
a.chip:hover { border-color: var(--act); color: var(--ink); text-decoration: none; }

/* ---- sql highlighting ------------------------------------------------ */
pre.sql { line-height: 1.65; white-space: pre-wrap; word-break: break-word;
  position: relative; padding-right: 58px; }
.copybtn { position: absolute; top: 6px; right: 6px; border: 1px solid var(--border);
  background: var(--panel); color: var(--muted); border-radius: 6px; padding: 2px 9px;
  font: 600 11px/1.6 ui-sans-serif, system-ui, sans-serif; cursor: pointer;
  opacity: 0; transition: opacity .12s; }
pre.sql:hover .copybtn, .copybtn:focus-visible { opacity: 1; }
.copybtn:hover { color: var(--ink); border-color: var(--muted); }
.copybtn.done { color: var(--ok); border-color: var(--ok); opacity: 1; }
.sql-k { color: var(--todo); font-weight: 600; }
.sql-s { color: var(--ok); }
.sql-n { color: var(--attn); }
.sql-c { color: var(--faint); font-style: italic; }
input[type=text], input[type=search], textarea, select { background: var(--panel2);
  border: 1px solid var(--border); color: var(--ink); border-radius: 7px;
  padding: 7px 10px; font: inherit; width: 100%; }
input[type=search] { max-width: 380px; }
input:focus, textarea:focus, select:focus { outline: none;
  border-color: var(--brand-accent); }
form.inline { display: inline; }
.searchrow { display: flex; gap: 8px; align-items: center; margin: 12px 0 16px; }
dl.props { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px;
  margin: 8px 0; }
dl.props dt { color: var(--muted); font-size: 11px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .06em; padding-top: 2px; }
dl.props dd { margin: 0; color: var(--ink-2); }
</style>
</head>
<body>
<header><div class="shell">
  <nav class="nav">
    <a class="brand" href="/?t={{ token }}"><span class="b-gray">gray</span>son<svg class="b-wing" width="15" height="9" viewBox="2 8 28 17" aria-hidden="true"><polygon points="2,8 15,20 15,25 4,13"/><polygon points="30,8 17,20 17,25 28,13"/></svg></a>
    <a class="tab {{ 'active' if nav == 'sessions' }}" href="/?t={{ token }}">Sessions</a>
    <a class="tab {{ 'active' if nav == 'knowledge' }}" href="/knowledge?t={{ token }}">Knowledge</a>
    <a class="tab {{ 'active' if nav == 'checks' }}" href="/checks?t={{ token }}">Checks</a>
    <a class="tab {{ 'active' if nav == 'records' }}" href="/records?t={{ token }}">Records</a>
    <span style="flex: 1;"></span>
    <button class="tab themebtn" type="button" id="themebtn"
      title="Theme: follows your OS unless pinned">◐ auto</button>
    <a class="tab {{ 'active' if nav == 'settings' }}" href="/settings?t={{ token }}"
      title="Workspace settings">Settings</a>
  </nav>
</div></header>
<script>
(function () {
  var btn = document.getElementById("themebtn");
  var order = ["auto", "light", "dark"];
  var icons = { auto: "◐ auto", light: "○ light", dark: "● dark" };
  function current() {
    try { return localStorage.getItem("grayson_theme") || "auto"; } catch (e) { return "auto"; }
  }
  function apply(mode) {
    if (mode === "auto") delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = mode;
    btn.textContent = icons[mode];
  }
  btn.addEventListener("click", function () {
    var next = order[(order.indexOf(current()) + 1) % order.length];
    try {
      if (next === "auto") localStorage.removeItem("grayson_theme");
      else localStorage.setItem("grayson_theme", next);
    } catch (e) {}
    apply(next);
  });
  apply(current());
})();
</script>
<main>
{% if error %}<div class="banner">{{ error }}</div>{% endif %}
{% block content %}{% endblock %}
</main>
<script>
/* Copy-to-clipboard on every SQL block. Text is captured before the button is
   appended so the button's own label never ends up in the copied text. */
(function () {
  function copy(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text);
    }
    var ta = document.createElement("textarea");   /* http://127.0.0.1 fallback */
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } finally { document.body.removeChild(ta); }
    return Promise.resolve();
  }
  document.querySelectorAll("pre.sql").forEach(function (pre) {
    var text = pre.textContent;
    var btn = document.createElement("button");
    btn.type = "button"; btn.className = "copybtn"; btn.textContent = "copy";
    btn.title = "Copy SQL to clipboard";
    btn.addEventListener("click", function () {
      copy(text).then(function () {
        btn.textContent = "copied"; btn.classList.add("done");
        setTimeout(function () {
          btn.textContent = "copy"; btn.classList.remove("done");
        }, 1400);
      });
    });
    pre.appendChild(btn);
  });
})();
</script>
</body>
</html>
