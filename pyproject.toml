[project]
name = "seekql"
version = "0.1.0"
description = "Agentic, open-ended QA and investigation over SQL tables and data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
seekql = "seekql.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
