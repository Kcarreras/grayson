[project]
name = "seekql"
version = "0.1.0"
description = "Agentic, open-ended QA and investigation over SQL tables and data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "mcp>=2.0.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "sqlglot>=30.17.0",
    "typer>=0.27.1",
    "uvicorn>=0.52.4",
]

[project.scripts]
seekql = "seekql.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/seekql/cli.py" = ["B008"]  # typer's option-as-default idiom

[tool.pytest.ini_options]
testpaths = ["tests"]
